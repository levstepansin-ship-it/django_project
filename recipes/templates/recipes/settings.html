{% extends "recipes/base.html" %}

{% block title %}Настройки — Wajos{% endblock %}

{% block content %}
<div class="recipe-area">
    <a href="{% url 'index' %}" class="btn btn-primary back-btn">← На главную</a>

    <div class="settings-card">
        <h1 class="page-title">⚙️ Настройки</h1>
        <p class="page-subtitle">Настройте Wajos под себя. Изменения сохраняются автоматически.</p>

        <!-- Формат таймера -->
        <div class="setting-item">
            <div class="setting-label">
                <span class="setting-icon">⏱️</span>
                <div>
                    <div class="setting-title">Формат таймера</div>
                    <div class="setting-desc">Как отображать время в таймерах рецептов</div>
                </div>
            </div>
            <div class="setting-control">
                <label class="radio-card">
                    <input type="radio" name="timer_format" value="mm:ss">
                    <span class="radio-card-inner">
                        <strong>4:32</strong>
                        <small>Минуты и секунды</small>
                    </span>
                </label>
                <label class="radio-card">
                    <input type="radio" name="timer_format" value="seconds">
                    <span class="radio-card-inner">
                        <strong>272 сек</strong>
                        <small>Только секунды</small>
                    </span>
                </label>
            </div>
            <div class="setting-status" id="timerFormatStatus"></div>
        </div>
    </div>
</div>

<style>
    .settings-card {
        background: var(--glass-bg-strong);
        backdrop-filter: var(--blur-amount); -webkit-backdrop-filter: var(--blur-amount);
        border-radius: 34px;
        padding: 38px 34px;
        box-shadow: var(--glass-shadow);
        border: 1px solid var(--glass-border);
    }
    .setting-item {
        padding: 26px 0;
        border-top: 1px solid var(--border-light);
    }
    .setting-item:first-of-type {
        border-top: none;
        padding-top: 0;
    }
    .setting-label {
        display: flex; align-items: center; gap: 16px;
        margin-bottom: 22px;
    }
    .setting-icon { font-size: 36px; filter: drop-shadow(0 4px 10px rgba(var(--accent-rgb),0.3)); }
    .setting-title { font-size: 19px; font-weight: 700; color: var(--text-primary); }
    .setting-desc { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
    .setting-control { display: flex; gap: 14px; flex-wrap: wrap; }
    .radio-card { flex: 1; min-width: 140px; cursor: pointer; }
    .radio-card input { display: none; }
    .radio-card-inner {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 22px 18px; border-radius: 22px;
        border: 1.5px solid var(--glass-border);
        background: var(--glass-bg);
        backdrop-filter: var(--blur-light); -webkit-backdrop-filter: var(--blur-light);
        transition: all 0.3s var(--spring);
        text-align: center;
    }
    .radio-card-inner strong { font-size: 22px; color: var(--text-primary); transition: color 0.3s var(--spring); }
    .radio-card-inner small { font-size: 12px; color: var(--text-secondary); }
    .radio-card input:checked + .radio-card-inner {
        border-color: var(--accent);
        background: var(--accent-gradient-soft);
        box-shadow: var(--glow-accent);
    }
    .radio-card input:checked + .radio-card-inner strong { color: var(--accent); }
    .radio-card-inner:hover {
        border-color: var(--accent);
        transform: translateY(-3px) scale(1.02);
        box-shadow: var(--glass-shadow-hover);
    }
    .setting-status {
        margin-top: 14px; font-size: 13px; font-weight: 600;
        color: var(--success); opacity: 0; transition: opacity 0.4s var(--spring);
    }
    .setting-status.visible { opacity: 1; }
</style>

<script>
    (async function initSettings() {
        let fp = localStorage.getItem('wajos_fp');
        if (!fp) { fp = 'fp_' + Date.now() + '_' + Math.random().toString(36).slice(2); localStorage.setItem('wajos_fp', fp); }

        // Загрузить текущие настройки
        try {
            const res = await fetch('/api/settings/?fingerprint=' + encodeURIComponent(fp));
            if (res.ok) {
                const data = await res.json();
                const radio = document.querySelector(`input[name="timer_format"][value="${data.timer_format}"]`);
                if (radio) radio.checked = true;
            }
        } catch(e) {}

        const radios = document.querySelectorAll('input[name="timer_format"]');
        radios.forEach(radio => {
            radio.addEventListener('change', async function() {
                const val = this.value;
                try {
                    const res = await fetch('/api/settings/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fingerprint: fp, timer_format: val }),
                    });
                    if (res.ok) {
                        const status = document.getElementById('timerFormatStatus');
                        status.textContent = '✅ Сохранено!';
                        status.classList.add('visible');
                        setTimeout(() => status.classList.remove('visible'), 2000);
                    }
                } catch(e) {}
            });
        });
    })();
</script>
{% endblock %}
